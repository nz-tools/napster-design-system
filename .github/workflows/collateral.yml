name: collateral

# Claim-integrity gate for sales/partner collateral. Runs on any PR that
# touches rendered collateral or the claims registry, so a reviewer can never
# approve a diff that reintroduces a July-2026-audit-class violation.
on:
  pull_request:
    paths:
      - 'collateral/**'
      - 'claims/**'
      - 'tools/lint-collateral.mjs'
      - 'tools/render-collateral.mjs'
      - '.github/workflows/collateral.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # lint-collateral.mjs is dependency-free by design, so no install step is
      # needed for the gate itself.
      - name: Lint collateral against the claims registry
        run: npm run lint:collateral

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Render collateral to PDF
        run: npm run render
      # Upload the rendered PDFs so reviewers approve the visual, not just the diff.
      - name: Upload rendered PDFs
        uses: actions/upload-artifact@v4
        with:
          name: collateral-pdfs
          path: dist/collateral/*.pdf
          if-no-files-found: error
