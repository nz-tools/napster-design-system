<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;background:#000;color:#fff;font-family:var(--font-body)}
.card{padding:32px 36px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.cell{border-radius:16px;padding:28px 32px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:20px;min-width:0}
.cell.dark{background:#000;border:1px solid rgba(255,255,255,.18)}
.cell.light{background:#fff}
.mark{height:56px;width:auto;margin-left:-4px}
.sentence{width:320px;max-width:100%;height:auto}
@media (max-width:640px){.card{grid-template-columns:1fr}}
</style></head><body class="napster"><div class="card">
  <div class="cell dark">
    <img class="mark" src="ai-disclosure/napster-ai-element-mark-white.png" alt="AI">
    <img class="sentence" src="ai-disclosure/napster-ai-element-sentence-mono-white.png" alt="Includes AI-generated actors.">
  </div>
  <div class="cell light">
    <img class="mark" src="ai-disclosure/napster-ai-element-mark-black.png" alt="AI">
    <img class="sentence" src="ai-disclosure/napster-ai-element-sentence-mono-black.png" alt="Includes AI-generated actors.">
  </div>
</div></body></html>
